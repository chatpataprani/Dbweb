 font-size="20" fill="#3d5bd9" text-anchor="middle">▣</text><text x="872" y="577" font-size="10" letter-spacing="1" fill="#6b7080">FILES</text><text x="872" y="601" font-size="16" font-weight="700" fill="#1b1d22">Image Analysis</text><text x="872" y="626" font-size="12" fill="#6b7080">Inspect image metadata and look for signs</text><text x="872" y="644" font-size="12" fill="#6b7080">of editing.</text><text x="1115" y="571" font-size="16" fill="#6b7080">↗</text></g><g><rect x="55" y="702" width="350" height="140" rx="13" fill="#fff" stroke="#dedfd9"/><text x="80" y="733" font-size="10" letter-spacing="1" fill="#6b7080">VALIDATION</text><text x="80" y="759" font-size="16" font-weight="700" fill="#1b1d22">IMEI Validator</text><text x="80" y="784" font-size="12" fill="#6b7080">Check an IMEI format and its checksum.</text><rect x="425" y="702" width="350" height="140" rx="13" fill="#fff" stroke="#dedfd9"/><text x="450" y="733" font-size="10" letter-spacing="1" fill="#6b7080">NETWORK</text><text x="450" y="759" font-size="16" font-weight="700" fill="#1b1d22">MAC Address Lookup</text><text x="450" y="784" font-size="12" fill="#6b7080">Validate a MAC address and identify vendor.</text><rect x="795" y="702" width="350" height="140" rx="13" fill="#fff" stroke="#dedfd9"/><text x="820" y="733" font-size="10" letter-spacing="1" fill="#6b7080">VALIDATION</text><text x="820" y="759" font-size="16" font-weight="700" fill="#1b1d22">Phone Number Tools</text><text x="820" y="784" font-size="12" fill="#6b7080">Validate phone number formats.</text></g></g></svg>