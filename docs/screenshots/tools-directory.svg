<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f6f6f4"/><rect x="55" y="38" width="1090" height="235" rx="20" fill="#fff" stroke="#dedfd9"/><ellipse cx="1050" cy="55" rx="230" ry="150" fill="#e6eafb" opacity=".75"/><text x="95" y="85" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#3d5bd9">✧  YOUR WORKSPACE</text><text x="95" y="145" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#1b1d22">Tools, all in one place.</text><text x="95" y="181" font-family="Arial,sans-serif" font-size="17" fill="#6b7080">A clean workspace for everyday file utilities, validators and analysis tools.</text><rect x="95" y="207" width="600" height="48" rx="11" fill="#f6f6f4" stroke="#dedfd9"/><text x="118" y="237" font-family="Arial,sans-serif" font-size="16" fill="#6b7080">⌕  Search tools...</text><g font-family="Arial,sans-serif" font-size="14"><g fill="#e6eafb" stroke="#3d5bd9"><rect x="55" y="295" width="70" height="38" rx="19"/><rect x="137" y="295" width="95" height="38" rx="19" fill="#fff" stroke="#dedfd9"/><rect x="244" y="295" width="80" height="38" rx="19" fill="#fff" stroke="#dedfd9"/><rect x="336" y="295" width="90" height="38" rx="19" fill="#fff" stroke="#dedfd9"/><rect x="438" y="295" width="75" height="38" rx="19" fill="#fff" stroke="#dedfd9"/><rect x="525" y="295" width="100" height="38" rx="19" fill="#fff" stroke="#dedfd9"/><rect x="637" y="295" width="105" height="38" rx="19" fill="#fff" stroke="#dedfd9"/><rect x="754" y="295" width="95" height="38" rx="19" fill="#fff" stroke="#dedfd9"/><rect x="861" y="295" width="90" height="38" rx="19" fill="#fff" stroke="#dedfd9"/><rect x="963" y="295" width="85" height="38" rx="19" fill="#fff" stroke="#dedfd9"/></g><g fill="#3d5bd9" text-anchor="middle"><text x="90" y="319">All</text></g><g fill="#6b7080" text-anchor="middle"><text x="184" y="319">Social</text><text x="284" y="319">Links</text