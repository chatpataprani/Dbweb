<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f6f4">
<title>You’re offline | Dbweb</title>
<style>
:root{color-scheme:light;--bg:#f6f6f4;--card:#fff;--text:#1b1d22;--muted:#6b7080;--border:#dedfd9;--accent:#3d5bd9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,460px);padding:clamp(24px,6vw,42px);text-align:center;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 16px 50px #18213b0b}
.mark{width:48px;height:48px;display:grid;place-items:center;margin:0 auto 22px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:24px}
h1{margin:0 0 10px;font-size:clamp(24px,6vw,32px);letter-spacing:-.7px;line-height:1.2}
p{margin:0;color:var(--muted)}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}
button,a{min-height:44px;padding:10px 15px;border-radius:9px;border:1px solid var(--border);font:inherit;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button{background:var(--accent);border-color:var(--accent);color:#fff}
a{background:#fff;color:var(--text)}
#status{font-size:12px;margin-top:16px}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">D</div>
<h1>You’re offline</h1>
<p>Dbweb couldn’t connect to the internet. Check your connection and try again.</p>
<div class="actions"><button type="button" onclick="location.reload()">Try again</button><a href="/">Go to Dbweb</a></div>
<p id="status" role="status">This page is saved on this device after your first visit.</p>
</main>
<script>
window.addEventListener("online",function(){document.getElementById("status").textContent="Connection restored. You can try again now.";});
</script>
</body>
</html>
