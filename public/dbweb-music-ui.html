<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dbweb Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0b10;--panel:#14141d;--panel2:#1b1b26;--line:#292936;--text:#f6f5fb;--muted:#9b9aaa;--accent:#a78bfa;--accent2:#8b5cf6;--danger:#fb7185;font-family:"DM Sans",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -20%,#34245b 0,transparent 40%),var(--bg);color:var(--text);min-height:100vh;padding-bottom:120px}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}img{display:block;max-width:100%}.app{max-width:1440px;margin:auto;padding:22px 28px 0;display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px}.sidebar{position:sticky;top:20px;height:calc(100vh - 40px);display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:10px;font:700 20px "Space Grotesk";letter-spacing:-.5px}.brand img{width:36px;height:36px;object-fit:contain}.nav{display:grid;gap:6px}.nav button,.side-action{display:flex;align-items:center;gap:13px;padding:12px 14px;border:0;border-radius:12px;background:transparent;color:var(--muted);text-align:left}.nav button.active,.nav button:hover,.side-action:hover{background:#211b32;color:#fff}.nav svg{width:19px}.sidebar-bottom{margin-top:auto}.main{min-width:0}.top{display:flex;align-items:center;gap:12px;margin-bottom:28px}.top h1{font:700 26px "Space Grotesk";margin:0}.top .spacer{flex:1}.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--panel);display:grid;place-items:center}.icon:hover{background:var(--panel2)}.hero{padding:20px 0 22px}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.hero h2{font:700 clamp(30px,4vw,48px)/1.05 "Space Grotesk";letter-spacing:-1.8px;margin:10px 0}.hero p{color:var(--muted);margin:0 0 20px}.searchrow{display:flex;gap:10px;max-width:720px}.searchbox{height:54px;display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:0 16px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.searchbox:focus-within{border-color:var(--accent)}.searchbox input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.searchbox input::placeholder{color:#777586}.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-weight:600}.btn.primary{background:var(--accent2);border-color:var(--accent2);color:white}.btn:disabled{opacity:.55;cursor:wait}.sourcebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sourcebar .selected{background:#34245b;border-color:#6d52a9;color:#fff}.suggestions{position:absolute;z-index:20;top:60px;left:0;right:0;padding:6px;background:#1a1924;border:1px solid var(--line);border-radius:13px;box-shadow:0 18px 50px #0009}.suggestions button{width:100%;display:block;text-align:left;padding:11px;border:0;border-radius:8px;background:transparent}.suggestions button:hover{background:#29243a}.searchwrap{position:relative;flex:1;min-width:0;max-width:720px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 13px}.sectionhead h3{font:600 21px "Space Grotesk";margin:0}.sectionhead span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}.track{min-width:0;padding:10px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#191923,#12121a);transition:border-color .18s,transform .18s}.track:hover{border-color:#685394;transform:translateY(-2px)}.cover{position:relative;width:100%;aspect-ratio:1;border-radius:11px;overflow:hidden;background:#252235}.cover img{width:100%;height:100%;object-fit:cover}.cover button{position:absolute;right:9px;bottom:9px;width:43px;height:43px;border:0;border-radius:50%;background:var(--accent2);color:white;display:grid;place-items:center;box-shadow:0 5px 20px #0008}.cover button svg{fill:currentColor}.trackinfo{padding:10px 2px 2px;min-width:0}.trackinfo strong,.trackinfo span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trackinfo strong{font-size:14px}.trackinfo span{margin-top:4px;color:var(--muted);font-size:12px}.empty{grid-column:1/-1;padding:38px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.empty strong{display:block;color:var(--text);font:600 18px "Space Grotesk";margin-bottom:6px}.player{position:fixed;z-index:30;left:20px;right:20px;bottom:16px;max-width:1400px;margin:auto;display:grid;grid-template-columns:minmax(180px,1fr) minmax(260px,1.2fr) minmax(180px,1fr);gap:20px;align-items:center;padding:12px 16px;border:1px solid #353342;border-radius:18px;background:#171620ed;backdrop-filter:blur(22px);box-shadow:0 14px 60px #0009}.now{display:flex;align-items:center;gap:11px;min-width:0}.now img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#292638}.nowtext{min-width:0}.nowtext b,.nowtext span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowtext b{font-size:13px}.nowtext span{font-size:12px;color:var(--muted);margin-top:3px}.controls{display:flex;justify-content:center;align-items:center;gap:12px}.controls button,.rightcontrols button{border:0;background:transparent;color:var(--muted);display:grid;place-items:center}.controls button:hover,.rightcontrols button:hover{color:white}.controls .mainplay{width:44px;height:44px;border-radius:50%;background:var(--accent2);color:white}.mainplay svg{fill:currentColor}.timeline{display:flex;align-items:center;gap:8px;margin-top:7px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.timeline span{min-width:34px;text-align:center}.range{width:100%;height:20px;accent-color:var(--accent);cursor:pointer;min-width:0}.rightcontrols{display:flex;align-items:center;justify-content:flex-end;gap:10px}.volume{width:110px}.rightcontrols .iconbtn{width:36px;height:36px}.player button:disabled{opacity:.4;cursor:default}.toast{position:fixed;z-index:60;left:50%;bottom:112px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:11px 16px;border-radius:12px;background:#292638;border:1px solid #48435a;box-shadow:0 8px 30px #0008;transition:.2s;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.queuepanel{position:fixed;z-index:40;right:18px;top:18px;bottom:112px;width:min(360px,calc(100vw - 36px));padding:16px;background:#171620;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 70px #000b;display:none;overflow:auto}.queuepanel.open{display:block}.queuehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.queuehead h3{margin:0;font:600 20px "Space Grotesk"}.queueitem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}.queueitem:hover,.queueitem.current{background:#29243a}.queueitem img{width:42px;height:42px;border-radius:8px;object-fit:cover}.queueitem div{min-width:0;flex:1}.queueitem b,.queueitem span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queueitem b{font-size:13px}.queueitem span{font-size:11px;color:var(--muted)}.mobilemenu{display:none}
@media(max-width:800px){body{padding-bottom:160px}.app{display:block;padding:14px 15px 0}.sidebar{display:none}.mobilemenu{display:grid}.top{margin-bottom:14px}.top h1{font-size:22px}.hero{padding:16px 0}.hero p{font-size:13px}.searchrow{display:block}.searchwrap{max-width:none}.searchrow>.btn{margin-top:9px;width:100%}.sourcebar .btn{font-size:12px;padding:0 10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.track{padding:8px}.player{left:8px;right:8px;bottom:8px;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 10px;border-radius:15px}.now img{width:44px;height:44px}.controls{grid-column:2;grid-row:1}.controls button:not(.mainplay){display:none}.playercenter{grid-column:1/-1;grid-row:2}.rightcontrols{grid-column:1/-1;grid-row:3;justify-content:space-between}.volume{flex:1;width:auto}.timeline{margin-top:0}.toast{bottom:175px}.queuepanel{top:10px;bottom:170px;right:10px;width:calc(100vw - 20px)}}
@media(min-width:801px){.playercenter{min-width:0}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><img src="/dbweb-logo.svg" alt="Dbweb">Dbweb Music</div>
<nav class="nav"><button class="active" data-view="home"><i data-lucide="house"></i>Home</button><button data-view="search"><i data-lucide="search"></i>Search</button><button data-view="liked"><i data-lucide="heart"></i>Liked songs</button></nav>
<div class="sidebar-bottom"><button class="side-action" id="queueOpen"><i data-lucide="list-music"></i>Play queue</button></div>
</aside>
<main class="main">
<header class="top"><button class="icon mobilemenu" id="mobileQueue" aria-label="Open queue"><i data-lucide="list-music"></i></button><h1>Dbweb Music</h1><span class="spacer"></span><button class="icon" id="queueTop" aria-label="Queue"><i data-lucide="list-music"></i></button></header>
<section class="hero"><div class="eyebrow">Your sound, your space</div><h2>Find your next<br>favorite sound.</h2><p>Search tracks, discover what's trending, and keep the music going.</p>
<div class="searchrow"><div class="searchwrap"><label class="searchbox"><i data-lucide="search"></i><input id="query" type="search" placeholder="Search songs or artists…" autocomplete="off"><button id="clearSearch" class="icon" style="width:32px;height:32px" hidden aria-label="Clear"><i data-lucide="x"></i></button></label><div class="suggestions" id="suggestions" hidden></div></div><button class="btn primary" id="searchButton">Search</button></div>
<div class="sourcebar"><button class="btn selected" id="dbwebMode">Music</button><button class="btn" id="spotifyMode">Spotify catalog</button><button class="btn" id="playlistButton"><i data-lucide="list-plus" style="width:16px;vertical-align:middle"></i> Import playlist</button></div>
</section>
<div class="sectionhead"><h3 id="sectionTitle">Trending now</h3><span id="trackCount"></span></div>
<section class="grid" id="tracks" aria-live="polite"><div class="empty"><strong>Loading music…</strong>Please wait.</div></section>
</main>
</div>
<section class="queuepanel" id="queuePanel"><div class="queuehead"><h3>Play queue</h3><button class="icon" id="queueClose" aria-label="Close"><i data-lucide="x"></i></button></div><div id="queueItems"></div></section>
<footer class="player">
<div class="now"><img id="currentArt" src="/dbweb-logo.svg" alt=""><div class="nowtext"><b id="currentTitle">Choose a track</b><span id="currentArtist">Your music will appear here</span></div></div>
<div class="playercenter"><div class="controls"><button id="shuffleButton" aria-label="Shuffle"><i data-lucide="shuffle"></i></button><button id="previousButton" aria-label="Previous"><i data-lucide="skip-back"></i></button><button class="mainplay" id="playButton" aria-label="Play"><i data-lucide="play"></i></button><button id="nextButton" aria-label="Next"><i data-lucide="skip-forward"></i></button><button id="repeatButton" aria-label="Repeat"><i data-lucide="repeat"></i></button></div><div class="timeline"><span id="elapsed">0:00</span><input class="range" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="duration">0:00</span></div></div>
<div class="rightcontrols"><button class="iconbtn" id="muteButton" aria-label="Mute"><i data-lucide="volume-2"></i></button><input class="range volume" id="volume" type="range" min="0" max="100" value="70" aria-label="Volume"><button class="iconbtn" id="downloadButton" aria-label="Download"><i data-lucide="download"></i></button><button class="iconbtn" id="queuePlayer" aria-label="Queue"><i data-lucide="list-music"></i></button></div>
</footer>
<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="metadata"></audio>
<script>
(()=>{
const $=id=>document.getElementById(id),audio=$('audio');
const state={tracks:[],queue:[],index:-1,mode:'music',shuffle:false,repeat:false,muted:false,volume:.7,loading:false,request:0,searchTimer:null,suggestTimer:null,playLock:false,abort:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Number(n);if(!Number.isFinite(n)||n<0)return'0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')};
const icon=()=>{try{window.lucide?.createIcons()}catch{}};
let toastTimer;
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function normalize(x,i){return{id:String(x.id||x.videoId||x.video_id||i),title:x.title||x.name||'Untitled',artist:x.channel||x.artist||x.uploader||x.author||'Unknown artist',url:x.url||x.youtube_link||x.link||x.webpage_url||'',thumbnail:x.thumbnail||x.thumbnail_url||x.thumbnailUrl||x.thumbnails?.high?.url||x.thumbnails?.[0]?.url||'',duration:Number(x.duration_seconds||x.duration||0)||0,spotifyUrl:x.spotifyUrl||'',spotify:!!(x.spotifyUrl||x.spotify)}}
function render(list){state.tracks=list;$('trackCount').textContent=list.length+' tracks';$('tracks').innerHTML=list.length?list.map((t,i)=>'<article class="track"><div class="cover"><img loading="lazy" src="'+esc(t.thumbnail||'/dbweb-logo.svg')+'" alt="" onerror="this.src=\'/dbweb-logo.svg\'"><button data-play="'+i+'" aria-label="Play '+esc(t.title)+'"><i data-lucide="play"></i></button></div><div class="trackinfo"><strong>'+esc(t.title)+'</strong><span>'+esc(t.artist)+'</span></div></article>').join(''):'<div class="empty"><strong>No tracks found</strong>Try another song or artist.</div>';icon()}
async function requestJSON(url,signal){const r=await fetch(url,{cache:'no-store',signal});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed. Please try again.');return d}
async function loadTrending(){const n=++state.request;$('sectionTitle').textContent='Trending now';$('tracks').innerHTML='<div class="empty"><strong>Loading music…</strong>Finding tracks for you.</div>';try{const d=await requestJSON('/api/music/trending?region=IN&limit=24');if(n!==state.request)return;render((d.results||[]).map(normalize).filter(t=>t.url))}catch(e){if(n===state.request){$('tracks').innerHTML='<div class="empty"><strong>Could not load music</strong>'+esc(e.message)+'</div>';toast(e.message)}}}
async function search(){const q=$('query').value.trim();if(!q)return;const n=++state.request;$('sectionTitle').textContent='Search results';$('tracks').innerHTML='<div class="empty"><strong>Searching…</strong>Finding matching tracks.</div>';try{const path=state.mode==='spotify'?'/api/music/spotify-search':'/api/music/search';const d=await requestJSON(path+'?q='+encodeURIComponent(q));if(n!==state.request)return;const rows=(d.results||[]).map((x,i)=>normalize({...x,url:x.url||x.spotifyUrl||''},i)).filter(t=>t.url);render(rows);$('sectionTitle').textContent='Results for “'+q+'”'}catch(e){if(n===state.request){$('tracks').innerHTML='<div class="empty"><strong>Search failed</strong>'+esc(e.message)+'</div>';toast(e.message)}}}
async function suggestions(q){if(state.mode!=='music'||q.trim().length<2){$('suggestions').hidden=true;return}try{const d=await requestJSON('/api/music/suggest?q='+encodeURIComponent(q.trim()));if($('query').value.trim()!==q.trim())return;const a=(d.suggestions||[]).slice(0,6);$('suggestions').innerHTML=a.map(s=>'<button type="button" data-suggestion="'+esc(s)+'">'+esc(s)+'</button>').join('');$('suggestions').hidden=!a.length}catch{$('suggestions').hidden=true}}
function current(){return state.queue[state.index]||null}
function updatePlayer(){const t=current();$('currentTitle').textContent=t?.title||'Choose a track';$('currentArtist').textContent=t?.artist||'Your music will appear here';$('currentArt').src=t?.thumbnail||'/dbweb-logo.svg';$('playButton').innerHTML='<i data-lucide="'+(audio.paused?'play':'pause')+'"></i>';$('muteButton').innerHTML='<i data-lucide="'+(audio.muted||audio.volume===0?'volume-x':'volume-2')+'"></i>';icon();$('elapsed').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);if(Number.isFinite(audio.duration)&&audio.duration>0&&!state.seeking)$('seek').value=Math.round(audio.currentTime/audio.duration*1000);$('shuffleButton').style.color=state.shuffle?'var(--accent)':'var(--muted)';$('repeatButton').style.color=state.repeat?'var(--accent)':'var(--muted)';$('volume').value=Math.round(audio.volume*100)}
function renderQueue(){const q=$('queueItems');q.innerHTML=state.queue.length?state.queue.map((t,i)=>'<div class="queueitem '+(i===state.index?'current':'')+'" data-queue="'+i+'"><img src="'+esc(t.thumbnail||'/dbweb-logo.svg')+'" alt=""><div><b>'+esc(t.title)+'</b><span>'+esc(t.artist)+'</span></div>'+(i===state.index?'<i data-lucide="volume-2"></i>':'')+'</div>').join(''):'<div class="empty"><strong>Queue is empty</strong>Choose a track to start listening.</div>';icon()}
async function resolve(t){if(t.spotify){const d=await requestJSON('/api/music/search?q='+encodeURIComponent(t.title+' '+t.artist));const match=(d.results||[]).map(normalize).find(x=>x.url);if(!match)throw Error('No playable version was found for this track.');return match.url}return t.url}
async function playAt(i){if(state.playLock)return;const t=state.queue[i];if(!t)return;state.playLock=true;state.index=i;state.abort?.abort();const controller=new AbortController();state.abort=controller;audio.pause();audio.removeAttribute('src');audio.load();updatePlayer();renderQueue();try{const url=await resolve(t);if(controller.signal.aborted)return;audio.src='/api/music/stream?q='+encodeURIComponent(url)+'&mode=audio';audio.load();await audio.play();toast('Now playing: '+t.title)}catch(e){if(!controller.signal.aborted){toast(e.name==='NotAllowedError'?'Tap play to start audio.':e.message||'Could not play this track.');updatePlayer()}}finally{state.playLock=false}}
function enqueue(t,autoplay=false){if(autoplay){state.queue=[...state.queue,t];playAt(state.queue.length-1);return}state.queue.push(t);renderQueue();toast('Added to queue')}
function next(){if(!state.queue.length)return;let i=state.index;if(state.shuffle&&state.queue.length>1){let n=i;while(n===i)n=Math.floor(Math.random()*state.queue.length);i=n}else i=(i+1)%state.queue.length;playAt(i)}
function previous(){if(audio.currentTime>3){audio.currentTime=0;return}if(state.index>0)playAt(state.index-1)}
function setMode(mode){state.mode=mode;$('dbwebMode').classList.toggle('selected',mode==='music');$('spotifyMode').classList.toggle('selected',mode==='spotify');$('query').placeholder=mode==='spotify'?'Search Spotify tracks and artists…':'Search songs or artists…';$('suggestions').hidden=true;if($('query').value.trim())search();else if(mode==='music')loadTrending();else{$('sectionTitle').textContent='Spotify catalog';render([])}}
$('tracks').addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(!b)return;const t=state.tracks[Number(b.dataset.play)];if(!t)return;state.queue=[...state.tracks];playAt(Number(b.dataset.play))});
$('query').addEventListener('input',()=>{const q=$('query').value;$('clearSearch').hidden=!q;clearTimeout(state.searchTimer);clearTimeout(state.suggestTimer);if(q.trim())state.searchTimer=setTimeout(search,550);state.suggestTimer=setTimeout(()=>suggestions(q),220);if(!q.trim())loadTrending()});
$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('suggestions').hidden=true;search()}if(e.key==='Escape')$('suggestions').hidden=true});
$('suggestions').addEventListener('click',e=>{const b=e.target.closest('[data-suggestion]');if(!b)return;$('query').value=b.dataset.suggestion;$('suggestions').hidden=true;search()});
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))$('suggestions').hidden=true});
$('searchButton').addEventListener('click',search);
$('clearSearch').addEventListener('click',()=>{$('query').value='';$('clearSearch').hidden=true;state.request++;$('suggestions').hidden=true;loadTrending()});
$('dbwebMode').addEventListener('click',()=>setMode('music'));$('spotifyMode').addEventListener('click',()=>setMode('spotify'));
$('playlistButton').addEventListener('click',async()=>{const link=prompt('Paste a YouTube playlist link');if(!link?.trim())return;const b=$('playlistButton');b.disabled=true;b.textContent='Importing…';try{const d=await requestJSON('/api/music/playlist?q='+encodeURIComponent(link.trim()));const rows=(d.results||[]).map(normalize).filter(t=>t.url);if(!rows.length)throw Error('No tracks were found in this playlist.');render(rows);state.queue=[...rows];state.index=-1;$('sectionTitle').textContent=d.title||'Imported playlist';toast('Playlist imported')}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='Import playlist'}});
$('playButton').addEventListener('click',()=>{if(state.playLock)return;if(!current()){if(state.tracks.length){state.queue=[...state.tracks];playAt(0)}return}if(audio.paused)audio.play().catch(()=>toast('Tap play again to start.'));else audio.pause()});
$('nextButton').addEventListener('click',next);$('previousButton').addEventListener('click',previous);
$('shuffleButton').addEventListener('click',()=>{state.shuffle=!state.shuffle;updatePlayer();toast(state.shuffle?'Shuffle on':'Shuffle off')});
$('repeatButton').addEventListener('click',()=>{state.repeat=!state.repeat;audio.loop=state.repeat;updatePlayer();toast(state.repeat?'Repeat one on':'Repeat off')});
$('volume').addEventListener('input',()=>{audio.volume=Number($('volume').value)/100;audio.muted=false;state.volume=audio.volume;updatePlayer()});
$('muteButton').addEventListener('click',()=>{audio.muted=!audio.muted;updatePlayer()});
$('seek').addEventListener('input',()=>{state.seeking=true;if(Number.isFinite(audio.duration))audio.currentTime=Number($('seek').value)/1000*audio.duration});
$('seek').addEventListener('change',()=>{state.seeking=false;updatePlayer()});
$('downloadButton').addEventListener('click',async()=>{const t=current();if(!t)return toast('Choose a track first.');try{const url=await resolve(t);const a=document.createElement('a');a.href='/api/music/stream?q='+encodeURIComponent(url)+'&mode=audio&download=1';a.download='dbweb-audio';document.body.append(a);a.click();a.remove()}catch(e){toast(e.message)}});
function toggleQueue(){$('queuePanel').classList.toggle('open')}['queueOpen','queueTop','queuePlayer','mobileQueue'].forEach(id=>$(id).addEventListener('click',toggleQueue));$('queueClose').addEventListener('click',()=>$('queuePanel').classList.remove('open'));
$('queueItems').addEventListener('click',e=>{const item=e.target.closest('[data-queue]');if(item)playAt(Number(item.dataset.queue))});
audio.addEventListener('play',updatePlayer);audio.addEventListener('pause',updatePlayer);audio.addEventListener('timeupdate',updatePlayer);audio.addEventListener('durationchange',updatePlayer);audio.addEventListener('volumechange',updatePlayer);
