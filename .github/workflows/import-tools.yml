name: Import complete tools suite

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-tools:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dbweb
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the upstream tool suite
        run: |
          git clone --depth 1 https://github.com/PBhadoo/punjab.pages.dev.git /tmp/tool-suite
          rm -rf public/tools
          mkdir -p public/tools
          tar --exclude=.git -C /tmp/tool-suite -cf - . | tar -xf - -C public/tools
          rm -f public/tools/README.md public/tools/TEMP_GENERAL_TOOLS_PLAN.md public/tools/wrangler.toml
      - name: Adapt tool links for Dbweb
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root = Path("public/tools")
          attrs = re.compile(r"""(?P<prefix>\b(?:href|src|action|poster|data-src)\s*=\s*)(?P<q>["'])(?P<url>/[^"']*|/)(?P=q)""", re.I)
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".js", ".css", ".json", ".xml", ".txt"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              def replace_attr(m):
                  url = m.group("url")
                  if url == "/tools" or url.startswith("/tools/") or url.startswith("//") or url.startswith("/#"):
                      return m.group(0)
                  if url.startswith("/"):
                      return m.group("prefix") + m.group("q") + "/tools" + url + m.group("q")
                  return m.group(0)
              text = attrs.sub(replace_attr, text)
              text = re.sub(r"""(["'])/(?!tools/|/|#)([^"']*)\1""", lambda m: m.group(1) + "/tools/" + m.group(2) + m.group(1), text)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit imported tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tools
          if git diff --cached --quiet; then
            echo "No tool changes to import."
            exit 0
          fi
          git commit -m "Import complete tools suite from supplied tool bundle"
          git push origin HEAD:main
